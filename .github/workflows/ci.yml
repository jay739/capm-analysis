name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Notebook test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy yfinance matplotlib seaborn statsmodels pytest ruff
      - name: Lint notebook and tests
        run: ruff check --select=E9,F63,F7,F82 .
      - name: Run every notebook cell offline
        run: pytest -q tests
